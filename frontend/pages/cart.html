<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <title>Your Cart | Unimart</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/product.css" />
    <link rel="stylesheet" href="../css/cart.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/components.css" />
  </head>
  <body>
    <!-- ================= HEADER (inlined - no runtime fetch) ================= -->
    <header class="site-header">
      <div class="header-top">
        <div class="header-left">
          <button class="hamburger" id="openMenu" aria-label="Open Menu">
            <i class="fa fa-bars"></i>
          </button>
          <div class="logo">
            <a href="../index.html"
              ><img src="../assets/icons/logo.svg" alt="Unimart Logo"
            /></a>
          </div>
        </div>
        <div class="header-search desktop-search">
          <input
            type="text"
            placeholder="Search your products..."
            id="searchInputDesktop"
          />
          <button aria-label="Search"><i class="fa fa-search"></i></button>
        </div>
        <div class="header-right footer-social">
          <a href="#" aria-label="Wishlist"
            ><i class="fa-regular fa-heart"></i
          ></a>
          <a href="cart.html" aria-label="Cart" class="cart-wrapper">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount" class="cart-count">0</span>
          </a>
          <a href="#" aria-label="Account" id="accountLink"
            ><i class="fa-regular fa-user"></i
          ></a>
        </div>
      </div>
      <form
        class="header-search mobile-search"
        role="search"
        onsubmit="return false;"
      >
        <input
          type="search"
          placeholder="Search your products..."
          id="searchInputMobile"
        />
        <button type="submit" aria-label="Search">
          <i class="fa fa-search"></i>
        </button>
      </form>
    </header>

    <aside class="mobile-menu" id="mobileMenu">
      <div class="mobile-menu-header">
        <div class="logo">
          <a href="../index.html"
            ><img src="../assets/icons/logo.svg" alt="Unimart Logo"
          /></a>
        </div>
        <button id="closeMenu">✖</button>
      </div>
      <nav class="mobile-nav">
        <button class="dropdown-toggle">Categories <span>▾</span></button>
        <div class="dropdown-menu"></div>
        <hr />
        <a href="#">Wishlist</a>
        <a href="cart.html">Cart</a>
        <a href="#" class="contact-btn">Contact</a>
      </nav>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main class="cart-container">
      <h2>Your Cart <span class="cart-icon">🛒</span></h2>
      <div id="cartItems" class="cart-items"></div>
      <section class="cart-action-bar">
        <div class="price-container">
          <div class="old-price-row" id="totalOldPrice"></div>
          <div class="final-price-row">
            <span class="grand-total" id="totalFinalPrice">NPR 0</span>
            <span class="info-icon">ⓘ</span>
          </div>
        </div>
        <button class="btn-checkout">Place Order</button>
      </section>
    </main>

    <!-- ================= FOOTER (inlined - no runtime fetch) ================= -->
    <footer class="site-footer">
      <div class="footer-container">
        <div class="footer-col">
          <a href="../index.html"
            ><img
              src="../assets/icons/logo.svg"
              alt="Unimart Logo"
              class="footer-logo"
          /></a>
          <p class="footer-text">
            Unimart is your trusted store for smart gadgets, toys and home decor
            for kids and families.
          </p>
        </div>
        <div class="footer-col">
          <h4>Contact</h4>
          <p>
            <i class="fa fa-phone"></i>
            <a href="tel:+9779700013011">+977 9700013011</a>
          </p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 Unimart | All Rights Reserved</p>
      </div>
    </footer>

    <div id="toast" class="toast"></div>
    <div id="orderOverlay" class="order-overlay">
      <div class="overlay-content">
        <div class="loader"></div>
        <h2>Processing Order...</h2>
        <p>Please wait a moment.</p>
      </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/toast.js"></script>
    <script src="../js/utils/normalize.js"></script>
    <script src="../js/utils/debounce.js"></script>
    <script src="../js/services/apiClient.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/services/categoryService.js"></script>
    <script src="../js/services/productService.js"></script>
    <script src="../js/services/cartService.js"></script>
    <script src="../js/services/checkoutService.js"></script>
    <script src="../js/state/authState.js"></script>
    <script src="../js/state/cartState.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/cart.js"></script>
  </body>
</html>
