<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Unimart</title>
     <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/checkout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </head>
  <body>
    <div class="checkout-header-mobile">
      <button onclick="history.back()" class="back-btn" aria-label="Go Back"><i class="fa-solid fa-arrow-left"></i></button>
      <h2>Order Summary</h2>
    </div>

    <main class="checkout-container">
      <div class="checkout-left">
        <section class="checkout-card" id="shippingForm">
          <h3><i class="fa-solid fa-truck"></i> Shipping Details</h3>
          <div class="form-group">
            <div>
              <input type="text" id="userName" placeholder="Your Full Name" required />
              <p class="field-error" id="errorName"></p>
            </div>
            <div>
              <input type="tel" id="userPhone" placeholder="Mobile Number (e.g., 98XXXXXXXX)" required inputmode="tel" autocomplete="tel" />
              <p class="field-error" id="errorPhone"></p>
            </div>
            <div>
              <textarea id="userAddress" placeholder="Full Delivery Address (Tole/Area, Ward No., Municipality, Landmark)" rows="3" required></textarea>
              <p class="field-error" id="errorAddress"></p>
            </div>
          </div>
        </section>

        <section class="checkout-card" id="paymentMethodArea">
          <h3><i class="fa-solid fa-credit-card"></i> Payment Method</h3>
          <div class="payment-options">
            <label class="payment-card-option">
              <input type="radio" name="payment" value="whatsapp" checked />
              <div class="pay-info">
                <strong>WhatsApp Order</strong>
                <p>Confirm & Pay manually on WhatsApp</p>
              </div>
              <i class="fa-brands fa-whatsapp whatsapp-icon"></i>
            </label>
            <label class="payment-card-option disabled">
              <input type="radio" name="payment" value="esewa" disabled />
              <div class="pay-info">
                <strong>eSewa Wallet</strong>
                <p>Coming Soon (Service Unavailable)</p>
              </div>
            </label>
          </div>
        </section>
      </div>

      <div class="checkout-right">
        <div class="checkout-card sticky-summary" id="summaryTarget">
          <h3>Price Details</h3>
          <div id="priceSummary" class="price-details-box"></div>
          <button class="btn-continue" id="checkoutBtn">PLACE ORDER</button>
        </div>
      </div>
    </main>

    <div class="mobile-bottom-bar">
      <div class="price-info">
        <span class="final-price" id="mobileTotalAmount">NPR 0</span>
        <span class="view-details" onclick="document.getElementById('summaryTarget').scrollIntoView({ behavior: 'smooth' })">View Details</span>
      </div>
      <button class="mobile-place-order" id="mobileCheckoutBtn">PLACE ORDER</button>
    </div>

    <div id="orderOverlay" class="order-overlay" style="display: none">
      <div class="overlay-content">
        <div class="loader"></div>
        <p>Processing your order...</p>
      </div>
    </div>
    <div id="toast" class="toast"></div>

    <script src="../js/config.js"></script>
    <script src="../js/utils/toast.js"></script>
    <script src="../js/utils/normalize.js"></script>
    <script src="../js/utils/debounce.js"></script>
    <script src="../js/services/apiClient.js"></script>
    <script src="../js/services/authService.js"></script>
    <script src="../js/services/categoryService.js"></script>
    <script src="../js/services/productService.js"></script>
    <script src="../js/services/cartService.js"></script>
    <script src="../js/services/checkoutService.js"></script>
    <script src="../js/state/authState.js"></script>
    <script src="../js/state/cartState.js"></script>
    <script src="../js/checkout.js"></script>
  </body>
</html>
