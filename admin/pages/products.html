<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — UNiMART Admin</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/products.css" />
</head>
<body>
  <div class="admin-shell" id="adminShell">
    <div id="adminShellRoot"></div>
  </div>

  <template id="productsTemplate">
    <div class="admin-page-header">
      <div>
        <h1>Products</h1>
        <p>Manage your product catalog and inventory.</p>
      </div>
      <button class="admin-btn admin-btn--primary" id="addProductBtn" type="button">+ Add Product</button>
    </div>

    <div class="admin-toolbar">
      <input class="admin-input admin-search-input" type="search" id="productSearchInput" placeholder="Search products by name…" />
      <select class="admin-select" id="productCategoryFilter">
        <option value="all">All categories</option>
      </select>
      <select class="admin-select" id="productStatusFilter">
        <option value="all">All statuses</option>
        <option value="active">Active only</option>
      </select>
    </div>

    <div class="admin-card">
      <div class="admin-card__body" style="padding: 0;" id="productsCardBody"></div>
    </div>

    <div class="admin-pagination hidden" id="productsPagination"></div>
  </template>

  <template id="productFormModalTemplate">
    <div class="admin-modal-backdrop" id="productModalBackdrop">
      <div class="admin-modal admin-modal--wide" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
        <div class="admin-modal__header">
          <h2 id="productModalTitle">Add Product</h2>
          <button class="admin-modal__close" id="productModalCloseBtn" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="admin-modal__body">
          <form id="productForm" novalidate>
            <div class="admin-field admin-field--full">
              <label>Product Images</label>
              <label class="admin-image-upload" id="productImageDropzone">
                <input type="file" id="productImageInput" accept="image/jpeg,image/png,image/webp" multiple />
                <span class="admin-image-upload__label"><strong>Click to upload</strong> or drag images here — JPEG/PNG/WEBP, up to 5MB each, max 5 images</span>
              </label>
              <div class="admin-image-grid" id="productImageGrid"></div>
              <span class="admin-error-text hidden" id="productImagesError"></span>
            </div>

            <div class="admin-form-grid">
              <div class="admin-field admin-field--full">
                <label for="productNameInput">Product Name</label>
                <input class="admin-input" type="text" id="productNameInput" required />
                <span class="admin-error-text hidden" id="productNameError"></span>
              </div>

              <div class="admin-field admin-field--full">
                <label for="productDescInput">Description</label>
                <textarea class="admin-textarea" id="productDescInput"></textarea>
              </div>

              <div class="admin-field">
                <label for="productCategoryInput">Category</label>
                <select class="admin-select" id="productCategoryInput">
                  <option value="">No category</option>
                </select>
              </div>

              <div class="admin-field">
                <label for="productSkuInput">SKU</label>
                <input class="admin-input" type="text" id="productSkuInput" placeholder="Auto-generated if left blank" />
              </div>

              <div class="admin-field">
                <label for="productPriceInput">Price</label>
                <input class="admin-input" type="number" id="productPriceInput" min="0.01" step="0.01" required />
                <span class="admin-error-text hidden" id="productPriceError"></span>
              </div>

              <div class="admin-field">
                <label for="productOldPriceInput">Old Price (optional)</label>
                <input class="admin-input" type="number" id="productOldPriceInput" min="0" step="0.01" />
                <span class="admin-error-text hidden" id="productOldPriceError"></span>
              </div>

              <div class="admin-field">
                <label for="productStockInput">Stock Quantity</label>
                <input class="admin-input" type="number" id="productStockInput" min="0" step="1" value="0" />
                <span class="admin-error-text hidden" id="productStockError"></span>
              </div>

              <div class="admin-field">
                <label for="productStatusInput">Status</label>
                <select class="admin-select" id="productStatusInput">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>

              <div class="admin-field admin-field--full">
                <label for="productTagsInput">Tags (comma-separated)</label>
                <input class="admin-input" type="text" id="productTagsInput" placeholder="e.g. summer, new-arrival" />
              </div>

              <div class="admin-field admin-field--full" style="flex-direction: row; gap: var(--admin-sp-5); flex-wrap: wrap;">
                <div class="admin-checkbox-row">
                  <input type="checkbox" id="productFeaturedInput" />
                  <label for="productFeaturedInput">Featured</label>
                </div>
                <div class="admin-checkbox-row">
                  <input type="checkbox" id="productBestSellerInput" />
                  <label for="productBestSellerInput">Best Seller</label>
                </div>
                <div class="admin-checkbox-row">
                  <input type="checkbox" id="productNewInput" checked />
                  <label for="productNewInput">Mark as New</label>
                </div>
              </div>
            </div>

            <div class="admin-form-actions">
              <button class="admin-btn admin-btn--secondary" id="productCancelBtn" type="button">Cancel</button>
              <button class="admin-btn admin-btn--primary" id="productSubmitBtn" type="submit">
                <span id="productSubmitText">Save Product</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>

  <template id="productDeleteModalTemplate">
    <div class="admin-modal-backdrop" id="productDeleteBackdrop">
      <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="productDeleteTitle">
        <div class="admin-modal__body">
          <div class="admin-confirm-icon admin-confirm-icon--danger" aria-hidden="true">!</div>
          <h2 id="productDeleteTitle">Delete product?</h2>
          <p id="productDeleteMessage" style="color: var(--admin-text-muted); font-size: var(--admin-fs-sm); margin-top: var(--admin-sp-2);"></p>
          <div class="admin-form-actions">
            <button class="admin-btn admin-btn--secondary" id="productDeleteCancelBtn" type="button">Cancel</button>
            <button class="admin-btn admin-btn--danger" id="productDeleteConfirmBtn" type="button">
              <span id="productDeleteConfirmText">Delete</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="../js/config.js"></script>
  <script src="../js/services/apiClient.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/services/categoryService.js"></script>
  <script src="../js/services/productService.js"></script>
  <script src="../js/services/uploadService.js"></script>
  <script src="../js/state/authState.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/debounce.js"></script>
  <script src="../js/services/notificationService.js"></script>
  <script src="../js/components/notificationBell.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/products.js"></script>
</body>
</html>
