<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — UNiMART Admin</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="admin-shell" id="adminShell">
    <div id="adminShellRoot"></div>
  </div>

  <template id="dashboardTemplate">
    <div class="admin-page-header">
      <div>
        <h1>Dashboard</h1>
        <p>Overview of your store, pulled live from the backend.</p>
      </div>
      <button class="admin-btn admin-btn--secondary" id="dashboardRefreshBtn" type="button">Refresh</button>
    </div>

    <div id="dashboardStateArea"></div>

    <div id="dashboardBody" class="hidden">
      <div class="admin-stat-grid" id="dashboardStats"></div>

      <div class="admin-card admin-recent-orders">
        <div class="admin-card__header">
          <h2>Recent Orders</h2>
          <a href="orders.html">View all orders</a>
        </div>
        <div class="admin-card__body" style="padding: 0;">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Placed</th>
                </tr>
              </thead>
              <tbody id="dashboardRecentOrdersBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="admin-dash-secondary-grid">
        <div class="admin-card">
          <div class="admin-card__header">
            <h2>Inventory Overview</h2>
            <a href="products.html">Manage products</a>
          </div>
          <div class="admin-card__body" style="padding: 0;">
            <div class="admin-table-wrap">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="dashboardInventoryBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card__header">
            <h2>Categories</h2>
            <a href="categories.html">Manage categories</a>
          </div>
          <div class="admin-card__body" id="dashboardCategoriesBody"></div>
        </div>
      </div>
    </div>
  </template>

  <script src="../js/config.js"></script>
  <script src="../js/services/apiClient.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/services/categoryService.js"></script>
  <script src="../js/services/productService.js"></script>
  <script src="../js/services/orderService.js"></script>
  <script src="../js/state/authState.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/services/notificationService.js"></script>
  <script src="../js/components/notificationBell.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/dashboard.js"></script>
</body>
</html>
