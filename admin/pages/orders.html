<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — UNiMART Admin</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/orders.css" />
</head>
<body>
  <div class="admin-shell" id="adminShell">
    <div id="adminShellRoot"></div>
  </div>

  <template id="ordersTemplate">
    <div class="admin-page-header">
      <div>
        <h1>Orders</h1>
        <p>All customer orders, newest first.</p>
      </div>
    </div>

    <div class="admin-toolbar">
      <select class="admin-select" id="orderStatusFilter">
        <option value="all">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="Processing">Processing</option>
        <option value="Shipped">Shipped</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <input class="admin-input admin-search-input" type="search" id="orderSearchInput" placeholder="Search by order ID or customer name…" />
    </div>

    <div class="admin-card">
      <div class="admin-card__body" style="padding: 0;" id="ordersCardBody"></div>
    </div>
  </template>

  <template id="orderDetailModalTemplate">
    <div class="admin-modal-backdrop" id="orderDetailBackdrop">
      <div class="admin-modal admin-modal--wide" role="dialog" aria-modal="true" aria-labelledby="orderDetailTitle">
        <div class="admin-modal__header">
          <h2 id="orderDetailTitle">Order</h2>
          <button class="admin-modal__close" id="orderDetailCloseBtn" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="admin-modal__body" id="orderDetailBody"></div>
      </div>
    </div>
  </template>

  <template id="orderStatusConfirmTemplate">
    <div class="admin-modal-backdrop" id="orderStatusConfirmBackdrop">
      <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="orderStatusConfirmTitle">
        <div class="admin-modal__body">
          <div class="admin-confirm-icon admin-confirm-icon--danger" aria-hidden="true">!</div>
          <h2 id="orderStatusConfirmTitle">Cancel this order?</h2>
          <p style="color: var(--admin-text-muted); font-size: var(--admin-fs-sm); margin-top: var(--admin-sp-2);">This marks the order as Cancelled and returns its items to stock. This cannot be undone from here.</p>
          <div class="admin-form-actions">
            <button class="admin-btn admin-btn--secondary" id="orderStatusConfirmCancelBtn" type="button">Go back</button>
            <button class="admin-btn admin-btn--danger" id="orderStatusConfirmOkBtn" type="button">
              <span id="orderStatusConfirmOkText">Cancel Order</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="../js/config.js"></script>
  <script src="../js/services/apiClient.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/services/orderService.js"></script>
  <script src="../js/state/authState.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/utils/orderView.js"></script>
  <script src="../js/utils/debounce.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/orders.js"></script>
</body>
</html>
