<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — UNiMART Admin</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body>
  <div class="admin-shell" id="adminShell">
    <div id="adminShellRoot"></div>
  </div>

  <template id="categoriesTemplate">
    <div class="admin-page-header">
      <div>
        <h1>Categories</h1>
        <p>Organize the categories products can be assigned to.</p>
      </div>
      <button class="admin-btn admin-btn--primary" id="addCategoryBtn" type="button">+ Add Category</button>
    </div>

    <div class="admin-card">
      <div class="admin-card__body" style="padding: 0;" id="categoriesCardBody"></div>
    </div>
  </template>

  <template id="categoryFormModalTemplate">
    <div class="admin-modal-backdrop" id="categoryModalBackdrop">
      <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
        <div class="admin-modal__header">
          <h2 id="categoryModalTitle">Add Category</h2>
          <button class="admin-modal__close" id="categoryModalCloseBtn" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="admin-modal__body">
          <form id="categoryForm" novalidate>
            <div class="admin-field">
              <label for="categoryNameInput">Category Name</label>
              <input class="admin-input" type="text" id="categoryNameInput" maxlength="60" required autocomplete="off" />
              <span class="admin-error-text hidden" id="categoryNameError"></span>
            </div>
            <div class="admin-form-actions">
              <button class="admin-btn admin-btn--secondary" id="categoryCancelBtn" type="button">Cancel</button>
              <button class="admin-btn admin-btn--primary" id="categorySubmitBtn" type="submit">
                <span id="categorySubmitText">Save Category</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>

  <template id="categoryDeleteModalTemplate">
    <div class="admin-modal-backdrop" id="categoryDeleteBackdrop">
      <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="categoryDeleteTitle">
        <div class="admin-modal__body">
          <div class="admin-confirm-icon admin-confirm-icon--danger" aria-hidden="true">!</div>
          <h2 id="categoryDeleteTitle">Delete category?</h2>
          <p id="categoryDeleteMessage" style="color: var(--admin-text-muted); font-size: var(--admin-fs-sm); margin-top: var(--admin-sp-2);"></p>
          <div class="admin-form-actions">
            <button class="admin-btn admin-btn--secondary" id="categoryDeleteCancelBtn" type="button">Cancel</button>
            <button class="admin-btn admin-btn--danger" id="categoryDeleteConfirmBtn" type="button">
              <span id="categoryDeleteConfirmText">Delete</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="../js/config.js"></script>
  <script src="../js/services/apiClient.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/services/categoryService.js"></script>
  <script src="../js/state/authState.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/services/notificationService.js"></script>
  <script src="../js/components/notificationBell.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/categories.js"></script>
</body>
</html>
